name: Daily campaign video report

on:
  schedule:
    # ─────────────────────────────────────────────────────────────────────────
    # CHANGING THE TIME THE REPORT ARRIVES
    #
    # This cron is ALWAYS in UTC and cannot be moved into .env or a secret:
    # GitHub parses this block before any environment exists. The TIMEZONE in
    # .env controls which calendar day a run is recorded against; this line
    # controls when it fires. Keep the two consistent.
    #
    #   UTC hour = the local hour you want  -  that zone's UTC offset
    #
    #   Want          Zone                 Offset      cron
    #   09:00         Asia/Manila          UTC+8       0 1 * * *   <-- current
    #   07:00         Asia/Manila          UTC+8       0 23 * * *  (prev. UTC day)
    #   09:00         Europe/Berlin        UTC+1/+2    0 8 * * *  / 0 7 * * *
    #   09:00         America/New_York     UTC-5/-4    0 14 * * * / 0 13 * * *
    #
    # GitHub cron has no DST awareness, so zones that observe DST drift by an
    # hour twice a year and need the line edited. Asia/Manila has no DST, which
    # is one reason it is a clean default.
    #
    # Scheduled runs can also be delayed during GitHub peak load. This is a
    # daily digest, so a few minutes' drift does not matter -- but do not rely
    # on it firing to the second.
    #
    # NOTE: GitHub disables scheduled workflows in repositories that go quiet
    # for 60 days. If the digest stops arriving, check that before debugging
    # anything in this repo -- and see the "silent failure" note in the README.
    # ─────────────────────────────────────────────────────────────────────────
    - cron: '0 1 * * *'
  workflow_dispatch: # lets anyone trigger a run by hand from the Actions tab

concurrency:
  # A slow run must never overlap the next day's. Snapshots are idempotent, so
  # an overlap would not corrupt data, but it would post the report twice.
  group: daily-campaign-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 400ms, and it means we never post numbers produced by broken logic.
      - name: Verify the analysis logic before trusting it
        run: npm test

      - name: Run the daily pipeline
        run: npm run job
        env:
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Manila' }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: absent means the digest falls back to the template writer.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
