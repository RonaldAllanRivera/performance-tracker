name: Daily campaign video report

on:
  schedule:
    # ─────────────────────────────────────────────────────────────────────────
    # CHANGING THE TIME THE REPORT ARRIVES
    #
    # This cron is ALWAYS in UTC and cannot be moved into .env or a secret:
    # GitHub parses this block before any environment exists. The TIMEZONE in
    # .env controls which calendar day a run is recorded against; this line
    # controls when it fires. Keep the two consistent.
    #
    #   UTC hour = the local hour you want  -  that zone's UTC offset
    #
    #   Want          Zone                 Offset      cron
    #   08:35         Asia/Manila          UTC+8       35 0 * * *  <-- current
    #   07:00         Asia/Manila          UTC+8       0 23 * * *  (prev. UTC day)
    #   09:00         Europe/Berlin        UTC+1/+2    0 8 * * *  / 0 7 * * *
    #   09:00         America/New_York     UTC-5/-4    0 14 * * * / 0 13 * * *
    #
    # GitHub cron has no DST awareness, so zones that observe DST drift by an
    # hour twice a year and need the line edited. Asia/Manila has no DST, which
    # is one reason it is a clean default.
    #
    # WHY 00:35 AND NOT 01:00. GitHub's scheduler is best-effort and is most
    # congested on the hour -- 00:00 and 01:00 UTC especially, because that is
    # where everyone points their daily jobs. Under load runs are delayed and
    # can be skipped entirely. The first 01:00 schedule here never fired at
    # all. An odd minute in a quieter slot avoids the stampede, and being
    # deliberately early means a typical delay still lands the report before
    # 9am rather than after it.
    #
    # MEASURED, NOT ASSUMED: as of 2026-08-12 this schedule had not fired once.
    # Two separate crons were configured and both were skipped entirely -- the
    # second was still absent 56 minutes after it was due -- while every
    # workflow_dispatch run succeeded. The workflow is active, on the default
    # branch, with a valid expression. GitHub's scheduler is best-effort and
    # deprioritises free-tier accounts; skipped runs are a documented
    # possibility, not a misconfiguration here.
    #
    # The design assumes a daily run and behaves correctly when one is missed:
    # snapshots are idempotent, and analyze.ts suppresses rate-based flags
    # across a multi-day gap rather than reporting three days of growth as a
    # one-day spike. What it cannot do is notice that a run never happened.
    # See "Productionizing" in the README -- a systemd timer with
    # Persistent=true is the fix, and a heartbeat is what makes a miss visible.
    #
    # NOTE: GitHub disables scheduled workflows in repositories that go quiet
    # for 60 days. If the digest stops arriving, check that before debugging
    # anything in this repo -- and see the "silent failure" note in the README.
    # ─────────────────────────────────────────────────────────────────────────
    - cron: '35 0 * * *'
  workflow_dispatch: # lets anyone trigger a run by hand from the Actions tab

concurrency:
  # A slow run must never overlap the next day's. Snapshots are idempotent, so
  # an overlap would not corrupt data, but it would post the report twice.
  group: daily-campaign-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 400ms, and it means we never post numbers produced by broken logic.
      - name: Verify the analysis logic before trusting it
        run: npm test

      - name: Run the daily pipeline
        run: npm run job
        env:
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Manila' }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # Store this base64-encoded, not as raw JSON. GitHub masks each LINE
          # of a multi-line secret separately, so a pretty-printed key file
          # turns its "{" and "}" lines into masks and every brace in the log
          # is replaced by *** -- including unrelated ones like `bash -e {0}`.
          # A single-line base64 blob registers one mask and leaves logs
          # readable. The job accepts either form; see src/inputs/sheet.ts.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          # Not a secret, but passed explicitly: if this is changed locally and
          # not here, CI silently reads and writes a different database, and the
          # digest compares today against a history that isn't its own.
          MONGO_DB: ${{ vars.MONGO_DB || 'campaign_tracker' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: absent means the digest falls back to the template writer.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
